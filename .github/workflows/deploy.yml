name: Deploy to AWS EC2

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:  # Дозволяє ручний запуск

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Deploy to EC2 via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        port: 22
        script: |
          cd ~/athlete-training-management-system
          
          # Pull latest code
          git pull origin main
          
          # Stop and remove old container
          sudo docker stop athlete-api || true
          sudo docker rm athlete-api || true
          
          # Build new Docker image
          sudo docker build -t nezerapp:latest .
          
          # Start new container
          sudo docker run -d \
            --name athlete-api \
            -e DB_HOST=${{ secrets.DB_HOST }} \
            -e DB_USER=${{ secrets.DB_USER }} \
            -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
            -e DB_NAME=${{ secrets.DB_NAME }} \
            -p 5000:5000 \
            nezerapp:latest
          
          # Check if container is running
          if sudo docker ps | grep athlete-api; then
            echo "✅ Container deployed successfully"
          else
            echo "❌ Container failed to start"
            exit 1
          fi
          
          echo "🚀 Deployment completed at $(date)"
    
    - name: Notify on success
      if: success()
      run: echo "✅ Deployment successful!"
    
    - name: Notify on failure
      if: failure()
      run: echo "❌ Deployment failed!"

